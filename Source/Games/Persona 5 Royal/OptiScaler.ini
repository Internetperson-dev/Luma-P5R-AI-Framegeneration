; Default OptiScaler configuration shipped with the P5R frame-generation build.
; Luma's OptiScaler integration panel rewrites the relevant keys and prompts for a restart.

[Plugins]
LoadReShade=true

[Inputs]
EnableDlssInputs=true

[Upscalers]
Dx11Upscaler=dlss

[Hotfix]
CreateD3D12DeviceForLuma=true

[Dx11withDx12]
DontUseNTShared=true

[FrameGen]
Enabled=true
FGInput=Upscaler
FGOutput=FSRFG
DisableHudless=false

[fakenvapi]
UseFakenvapi=true
LowLatencyInput=1
LowLatencyOutput=1
ForceXeLL=false
ForceLatencyFlex=false
ForceReflex=0
